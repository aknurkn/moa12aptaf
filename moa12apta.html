<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASSESSMENT LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: squared maths-notebook canvas, left-aligned 1040px column. Home = headline beside a marked
     solution (the criteria in action), then the seven modules as a route. Inner pages narrow to 820px. */
  --bg:#111B35; --cd:#18244A; --cd2:#22305F; --ln:#2C3B6E;
  --tx:#EDF1FF; --mu:#9BA8CF;
  --pu:#735BFF; --gr:#23B98A; --or:#FFB454; --rd:#FF6B7A;
  --pu-t:#BFB3FF; --gr-t:#4FD9AC; --or-t:#FFB454; --rd-t:#FF8E9A;
  --pu-s:rgba(115,91,255,.17); --gr-s:rgba(35,185,138,.16); --or-s:rgba(255,180,84,.14); --rd-s:rgba(255,107,122,.16);
  --grid:rgba(160,180,255,.075); --margin:rgba(255,107,122,.5);
  --sh:0 20px 50px rgba(4,9,28,.5);
  --fd:"Unbounded","Golos Text",system-ui,sans-serif;
  --fb:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#F3F5FC; --cd:#FFFFFF; --cd2:#ECE9FF; --ln:#D6DCEF;
  --tx:#141D3A; --mu:#56617F;
  --pu-t:#4A35C8; --gr-t:#0F7A55; --or-t:#955300; --rd-t:#C02D45;
  --pu-s:rgba(115,91,255,.12); --gr-s:rgba(35,185,138,.14); --or-s:rgba(255,180,84,.2); --rd-s:rgba(255,107,122,.14);
  --grid:rgba(70,100,210,.11); --margin:rgba(224,70,90,.55);
  --sh:0 18px 40px rgba(40,50,110,.14);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.6 var(--fb);transition:background .3s,color .3s}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(55% 45% at 88% 0%,var(--pu-s),transparent 70%),
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/28px 28px;
  -webkit-mask-image:linear-gradient(#000 25%,transparent 92%);mask-image:linear-gradient(#000 25%,transparent 92%)}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
h1,h2,h3,p{overflow-wrap:break-word}
.mu{color:var(--mu)}.sm{font-size:14px}

/* icons */
.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.i.fill{fill:currentColor;stroke:none}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--ln)}
.top .in2{max-width:1040px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.lg{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;color:var(--tx);font:600 13px/1 var(--fd);letter-spacing:.02em;cursor:pointer;border-radius:10px}
.lg svg,.lg2 svg{width:30px;height:30px;flex:none}
.pg{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mu);white-space:nowrap}
.pg b{color:var(--tx);font-variant-numeric:tabular-nums}
.pb{display:block;width:110px;height:8px;border-radius:9px;background:var(--ln);overflow:hidden}
u{display:block;height:100%;text-decoration:none;border-radius:9px;background:linear-gradient(90deg,var(--pu),var(--gr));transition:width .5s}
.th2{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--cd);color:var(--tx);border:1px solid var(--ln);cursor:pointer;transition:border-color .15s}
.th2:hover{border-color:var(--pu)}
@media(max-width:480px){.pb{display:none}.lg{font-size:12px}}

.w{max-width:1040px;margin:0 auto;padding:28px 20px 64px}
.w:not(.v-home):not(.v-learn):not(.v-an):not(.v-mentor):not(.v-tb):not(.v-teach):not(.v-stu):not(.v-lab):not(.v-game){max-width:820px}

/* buttons */
.b,.b2{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 20px;font:600 15px/1.25 var(--fb);cursor:pointer;text-decoration:none;transition:transform .12s,background .15s,border-color .15s}
.b{background:var(--pu);color:#fff;border:1px solid transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 20px rgba(115,91,255,.32)}
.b:hover{background:#8672FF}
.b2{background:transparent;color:var(--tx);border:1px solid var(--ln)}
.b2:hover{border-color:var(--pu);background:var(--pu-s)}
.b:active,.b2:active{transform:translateY(1px)}
.big{padding:15px 26px;font-size:17px;border-radius:14px}
.lnk{background:none;border:0;padding:0;color:var(--mu);font:inherit;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.lnk:hover{color:var(--tx)}
.nv{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin:18px 0 0}
.nv.ctr{justify-content:center}
.snv{position:sticky;bottom:0;z-index:5;padding:22px 0 12px;background:linear-gradient(transparent,var(--bg) 24px)}

/* home hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:44px;align-items:center;padding:24px 0 52px}
h1{font:600 clamp(24px,3.5vw,38px)/1.24 var(--fd);letter-spacing:-.01em;margin:0 0 16px;text-wrap:balance}
.sub{font-size:18px;color:var(--mu);max-width:32em;margin:0 0 26px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
@media(max-width:820px){.hero{grid-template-columns:1fr;gap:30px;padding:8px 0 40px}}

/* the marked solution */
.nb{position:relative;margin:0;padding:22px 22px 20px 56px;border:1px solid var(--ln);border-radius:6px 18px 18px 6px;box-shadow:var(--sh);transform:rotate(1.2deg);
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px,var(--cd)}
.nb::before,.ex::before{content:"";position:absolute;top:0;bottom:0;left:38px;width:1.5px;background:var(--margin)}
.nb figcaption{font-size:14px;color:var(--mu);margin-bottom:4px}
.nb .task{font:500 clamp(22px,2.8vw,28px)/1.3 var(--fd);margin-bottom:14px}
.nb ol{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.nb li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px dashed var(--ln)}
.nb .eq{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.nb .ds{display:block;font-size:14px;font-weight:400;color:var(--mu)}
.nb .mk{display:flex;align-items:center;gap:6px;color:var(--gr-t);font-weight:700;white-space:nowrap}
.nb .mk svg{width:28px;height:28px;fill:none;stroke:var(--gr);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.nb .sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:14px;font-weight:600}
.nb .sum b{font:600 26px/1 var(--fd);color:var(--gr-t)}
.intro .nb .mk path{stroke-dasharray:44;animation:tick .5s ease-out both;animation-delay:calc(.5s + var(--d)*.45s)}
@keyframes tick{from{stroke-dashoffset:44}to{stroke-dashoffset:0}}

/* sections */
.sec{margin:0 0 44px}
.sec>h2{font:700 22px/1.3 var(--fb);margin:0 0 4px}
.sec>p{margin:0 0 16px;max-width:60ch}

/* module route */
.path{list-style:none;margin:0;padding:0;position:relative}
.path::before{content:"";position:absolute;left:25px;top:30px;bottom:30px;width:2px;background:var(--ln)}
.stop{position:relative;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:16px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:16px;padding:10px 14px 10px 0;color:inherit;font:inherit;cursor:pointer;transition:background .2s}
.stop:hover{background:var(--cd)}
.num{position:relative;z-index:1;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--bg);border:2px solid var(--ln);font:500 16px/1 var(--fd);color:var(--mu)}
.stop.dn .num{background:var(--gr);border-color:var(--gr);color:#06281D}
.stop.cur .num{border-color:var(--pu);color:var(--tx);box-shadow:0 0 0 5px var(--pu-s)}
.tt b{display:block;font-size:17px;line-height:1.35}
.tt small{font-size:14px;color:var(--mu)}
.meta{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mu);white-space:nowrap}
.meta b{color:var(--gr-t);font-variant-numeric:tabular-nums}
.stop.dn .meta>span:last-of-type{color:var(--gr-t);font-weight:600}
.seg{display:flex;gap:3px}
.seg i{width:14px;height:5px;border-radius:3px;background:var(--ln)}
.seg i.f{background:var(--pu)}
.stop.dn .seg i.f{background:var(--gr)}
@media(max-width:600px){.stop{grid-template-columns:52px minmax(0,1fr);row-gap:4px}.meta{grid-column:2}.meta .i{display:none}}

/* cards and form */
.c{background:var(--cd);border:1px solid var(--ln);border-radius:20px;padding:24px;margin:0 0 14px}
.c h3{margin:0 0 10px;font-size:18px;line-height:1.35}
@media(max-width:560px){.c{padding:18px 16px}}
.lb{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
.in{width:100%;background:var(--bg);color:var(--tx);border:1.5px solid var(--ln);border-radius:12px;padding:11px 14px;font:inherit}
.in:focus{outline:none;border-color:var(--pu);box-shadow:0 0 0 4px var(--pu-s)}
textarea.in{resize:vertical;display:block}
.join{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:center}
.how{list-style:none;margin:18px 0 14px;padding:0;counter-reset:h;display:grid;gap:8px}
.how li{counter-increment:h;display:flex;gap:12px;align-items:baseline}
.how li::before{content:counter(h);flex:none;width:24px;height:24px;border-radius:50%;background:var(--pu-s);color:var(--pu-t);font:600 12px/24px var(--fb);text-align:center}
.qrb{display:grid;justify-items:center;gap:8px;text-align:center}
.qr{display:grid;place-items:center;min-width:148px;min-height:148px;padding:10px;border-radius:14px;border:1px solid var(--ln);background:#fff;color:#111B35}
.qrb small{max-width:160px;color:var(--mu)}
@media(max-width:600px){.join{grid-template-columns:1fr}}

/* module page */
.mods{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.mods button{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:none;border:1.5px solid var(--ln);color:var(--mu);font:500 12px/1 var(--fd);cursor:pointer;transition:border-color .15s}
.mods button:hover{border-color:var(--pu)}
.mods .dn{border-color:var(--gr);color:var(--gr-t)}
.mods .on{background:var(--pu);border-color:var(--pu);color:#fff}
.mh{display:flex;align-items:center;gap:16px;margin:0 0 6px}
.mic{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:16px;background:var(--pu-s);color:var(--pu-t)}
.mic .i{width:26px;height:26px}
.kick{margin:0;font-size:14px;color:var(--mu)}
.mh h2{font:700 clamp(21px,3vw,28px)/1.25 var(--fb);margin:2px 0 0;text-wrap:balance}
.stp{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:20px 0 16px}
.stp button{background:none;border:0;padding:0 0 4px;text-align:left;color:var(--mu);font:500 13px/1.3 var(--fb);cursor:pointer}
.stp button::before{content:"";display:block;height:5px;border-radius:3px;background:var(--ln);margin-bottom:8px;transition:background .2s}
.stp .dn{color:var(--gr-t)}.stp .dn::before{background:var(--gr)}
.stp .on{color:var(--tx);font-weight:700}.stp .on::before{background:var(--pu)}
@media(max-width:480px){.stp button{font-size:12px}}
.th{max-width:66ch;margin:0 0 14px}
.th.lead{font-size:19px;line-height:1.55;font-weight:500}
.key{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;margin-top:20px;padding:14px 16px;border-radius:4px 14px 14px 4px;background:var(--pu-s);border-left:4px solid var(--pu)}
.key .i{width:22px;height:22px;color:var(--pu-t);margin-top:2px}
.vid{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding:14px 16px;border:1px solid var(--ln);border-radius:14px}
.vid>div:first-child{display:grid;min-width:0}
.va{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:600;background:var(--pu-s);color:var(--pu-t)}
.tag.or{background:var(--or-s);color:var(--or-t)}
.ex{position:relative;margin-top:12px;padding:18px 20px 18px 54px;border:1px solid var(--ln);border-radius:6px 16px 16px 6px;font-size:17px;line-height:1.75;
  background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px,var(--bg)}
.tl,.sw{display:grid;gap:4px;margin:4px 0 14px}
.tl span,.sw span{display:flex;align-items:center;gap:10px}
.tl i{flex:none;width:14px;height:14px;border-radius:50%}
.sw{margin-bottom:0}.sw .i{color:var(--or-t)}
.ph{font-size:17px;max-width:66ch;margin:10px 0 14px}
.chat{display:grid;gap:10px;margin:14px 0 20px}
.bub{max-width:34em;padding:10px 14px;background:var(--bg);border:1px solid var(--ln);border-radius:4px 16px 16px 16px}
.bub small{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mu)}
.bub.t{justify-self:end;border-radius:16px 4px 16px 16px;background:var(--pu-s);border-color:transparent}

/* questions */
.q{padding:0 0 18px;margin:0 0 18px;border-bottom:1px solid var(--ln)}
.q:last-child{padding:0;margin:0;border:0}
.q>b{display:block;font-size:17px;line-height:1.4;margin-bottom:10px}
.qh{font-size:19px!important;line-height:1.4;margin:0 0 14px!important}
.os{display:grid;gap:8px}
.os.two{grid-template-columns:1fr 1fr}
.o{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);color:var(--tx);border:1.5px solid var(--ln);border-radius:14px;padding:11px 14px;font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.os.two .o{justify-content:center;text-align:center;font-weight:600}
.o:hover:not(:disabled){border-color:var(--pu)}
.lt{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--cd2);color:var(--mu);font-weight:700;font-size:13px}
.o.sel{border-color:var(--pu);background:var(--pu-s)}.o.sel .lt{background:var(--pu);color:#fff}
.o.ok{border-color:var(--gr);background:var(--gr-s)}.o.ok .lt{background:var(--gr);color:#06281D}
.o.no{border-color:var(--rd);background:var(--rd-s)}.o.no .lt{background:var(--rd);color:#3B0710}
.o:disabled{cursor:default;color:var(--tx)}
.o:disabled:not(.ok):not(.no){opacity:.55}
.fb{display:flex;align-items:flex-start;gap:10px;margin:10px 0 0;padding:10px 14px;border-radius:12px;background:var(--bg)}
.fb .i{margin-top:.22em}
.fb.y{background:var(--gr-s)}.fb.y .i{color:var(--gr-t)}
.fb.n{background:var(--rd-s)}.fb.n .i{color:var(--rd-t)}
.warn{color:var(--or-t);font-weight:600;margin:12px 0 0}
.cb{display:flex;align-items:center;gap:12px;margin:8px 0;padding:12px 14px;background:var(--bg);border:1.5px solid var(--ln);border-radius:14px;cursor:pointer}
.cb input{flex:none;width:20px;height:20px;accent-color:var(--gr)}
.cb span{flex:1}
.cb em{font-style:normal;font-size:13px;font-weight:600;white-space:nowrap;padding:2px 10px;border-radius:20px;background:var(--or-s);color:var(--or-t)}
.cb:has(input:checked){border-color:var(--gr);background:var(--gr-s)}

/* quarter calculator */
.sl{display:grid;grid-template-columns:64px minmax(0,1fr) 62px;align-items:center;gap:12px;margin:12px 0;font-weight:600}
.sl input{width:100%;accent-color:var(--pu)}
.sl b{text-align:right;font-variant-numeric:tabular-nums}
.cres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0 0}
.cres span{display:grid;padding:10px 14px;border-radius:14px;background:var(--bg);font-size:14px;color:var(--mu)}
.cres b{font:500 22px/1.3 var(--fd);color:var(--tx);font-variant-numeric:tabular-nums}
.cres .gd{color:var(--gr-t)}.cres .g4{color:var(--pu-t)}.cres .g3{color:var(--or-t)}.cres .g2{color:var(--rd-t)}
.scl{position:relative;display:grid;grid-template-columns:40fr 25fr 20fr 15fr;gap:2px;height:34px;margin:34px 0 10px}
.scl span{display:grid;place-items:center;font-weight:700;font-size:14px}
.scl span:nth-child(1){background:var(--rd-s);color:var(--rd-t);border-radius:10px 0 0 10px}
.scl span:nth-child(2){background:var(--or-s);color:var(--or-t)}
.scl span:nth-child(3){background:var(--pu-s);color:var(--pu-t)}
.scl span:nth-child(4){background:var(--gr-s);color:var(--gr-t);border-radius:0 10px 10px 0}
.scl i{position:absolute;top:-8px;bottom:-8px;width:3px;border-radius:2px;background:var(--tx);transform:translateX(-50%);transition:left .2s}

/* final test */
.who{display:flex;align-items:center;gap:8px;margin:8px 0 16px;color:var(--mu)}
.dots{display:grid;grid-template-columns:repeat(10,minmax(0,36px));gap:6px;margin:0 0 16px}
.dots button{aspect-ratio:1;border-radius:50%;background:none;border:1.5px solid var(--ln);color:var(--mu);font:600 13px/1 var(--fb);padding:0;cursor:pointer}
.dots .a{background:var(--pu-s);border-color:var(--pu);color:var(--tx)}
.dots .on{background:var(--pu);border-color:var(--pu);color:#fff}
.rs{text-align:center}
.rs .who{justify-content:center;margin-top:0}
.rs .fb{text-align:left;max-width:32em;margin:12px auto 0}
.ring{position:relative;width:156px;height:156px;margin:0 auto 14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .tr{stroke:var(--ln)}
.ring .vl{stroke-linecap:round;transition:stroke-dasharray .8s}
.ring div{position:absolute;inset:0;display:flex;align-items:baseline;justify-content:center;padding-top:50px}
.ring b{font:600 44px/1 var(--fd)}
.ring span{font-size:18px;color:var(--mu)}
.msg{font-size:18px;max-width:30em;margin:0 auto}
.rh{font-size:18px;margin:26px 0 10px}
.rvw .fb:first-child{margin-top:0}

/* leaderboard */
.lbr{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(60px,170px) 56px;gap:12px;align-items:center;margin:6px 0;padding:10px 14px;border-radius:14px;background:var(--bg)}
.rk{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--cd2);color:var(--mu);font:500 12px/1 var(--fd)}
.r1 .rk{background:#FFB454;color:#3A2400}.r2 .rk{background:#C9D2EA;color:#1B2440}.r3 .rk{background:#D69562;color:#33190A}
.nm{font-weight:600;overflow-wrap:anywhere}
.br{height:8px;border-radius:5px;background:var(--ln);overflow:hidden}
.br i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--pu),var(--gr))}
.scv{text-align:right;font:500 14px/1 var(--fd);font-variant-numeric:tabular-nums}
.lbr.me{background:var(--gr-s);outline:1.5px solid var(--gr)}
@media(max-width:480px){.lbr{grid-template-columns:36px minmax(0,1fr) 56px}.br{display:none}}

/* game */
.gst{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0 12px}
.gst div{padding:12px 14px;border-radius:16px;background:var(--cd);border:1px solid var(--ln)}
.gst small{display:block;font-size:13px;color:var(--mu)}
.gst b{font:500 22px/1.3 var(--fd);font-variant-numeric:tabular-nums}
.gst span{display:block;font-size:13px;color:var(--pu-t)}
.rs .gst{text-align:left;margin:18px 0 0}
.rs .gst div{background:var(--bg)}
.bar2{height:8px;border-radius:9px;background:var(--ln);overflow:hidden;margin-bottom:6px}
.bar2.thin{height:4px}
